es temps de lecture sont proposés</text><text x="978" y="822" fill="#203B42" font-family="Segoe UI" font-size="16" font-weight="400">dans cette démonstration. Les conditions</text><text x="978" y="847" fill="#203B42" font-family="Segoe UI" font-size="16" font-weight="400">d’un éventuel emprunt ne sont pas</text><text x="978" y="872" fill="#203B42" font-family="Segoe UI" font-size="16" font-weight="400">décrites.</text><text x="64" y="1013" fill="#203B42" font-family="Georgia" font-size="29" font-weight="400">Accès physique : information non documentée</text><text x="64" y="1052" fill="#203B42" font-family="Segoe UI" font-size="18" font-weight="400">L’absence d’information ne permet de conclure ni à l’accessibilité,</text><text x="64" y="1081" fill="#203B42" font-family="Segoe UI" font-size="18" font-weight="400">ni à l’inaccessibilité du bâtiment fictif.</text><text x="64" y="1159" fill="#203B42" font-family="Georgia" font-size="31" font-weight="400">Événement associé</text><rect x="64" y="1186" width="1312" height="160" fill="#F1E3DC"/><rect x="64" y="1186" width="5" height="160" fill="#93482F"/><text x="88" y="1218" fill="#783B28" font-family="Segoe UI" font-size="13" font-weight="600">ANNULÉ</text><text x="88" y="1260" fill="#203B42" font-family="Georgia" font-size="28" font-weight="400">Histoires au bord de l’eau</text><text x="88" y="1294" fill="#203B42" font-family="Segoe UI" font-size="17" font-weight="400">21 novembre 2026, 15 h–16 h • Motif non renseigné ; aucune nouvelle date annoncée.</text><text x="88" y="1326" fill="#174F62" font-family="Segoe UI" font-size="16" font-weight="600">Consulter l’événement annulé →</text><text x="64" y="1392" fill="#203B42" font-family="Segoe UI" font-size="14" font-weight="400">Date éditoriale fictive : 9 novembre 2026 • EQ-01 r1 • Événement : variante S4</text><text x="64" y="1441" fill="#174F62" font-family="Segoe UI" font-size="17" font-weight="600">← Retour aux équipements</text><text x="64" y="1490" fill="#203B42" font-family="Segoe UI" font-size="13" font-weight="400">BR-C3 V1 • Détail EQ-01, variante S4 • Illustration imaginaire • Vue fixe</text><rect x="0" y="1530" width="1440" height="110" fill="#203B42"/><text x="64" y="1573" fill="#FFFFFF" font-family="Georgia" font-size="28" font-weight="400">Belle-Rive</text><text x="64" y="1607" fill="#FFFFFF" font-family="Segoe UI" font-size="14" font-weight="400">Démonstration personnelle • Commune et données fictives • Aucun service réel</text></svg>