ns le scénario</text><text x="630" y="1801" fill="#203B42" font-family="Segoe UI" font-size="15" font-weight="400">Des temps de lecture sont proposés</text><text x="630" y="1826" fill="#203B42" font-family="Segoe UI" font-size="15" font-weight="400">dans cette démonstration. Les conditions</text><text x="630" y="1851" fill="#203B42" font-family="Segoe UI" font-size="15" font-weight="400">d’un éventuel emprunt ne sont pas</text><text x="630" y="1876" fill="#203B42" font-family="Segoe UI" font-size="15" font-weight="400">décrites.</text><text x="630" y="1949" fill="#203B42" font-family="Segoe UI" font-size="12" font-weight="400">Consultation sur place • lieu fictif</text><text x="630" y="1985" fill="#203B42" font-family="Segoe UI" font-size="12" font-weight="400">Date éditoriale fictive : 9 novembre 2026</text><text x="630" y="2006" fill="#203B42" font-family="Segoe UI" font-size="12" font-weight="400">EQ-01 r1 • Variante S4</text><text x="630" y="2053" fill="#174F62" font-family="Segoe UI" font-size="15" font-weight="600">← Retour aux équipements</text><rect x="610" y="2092" width="390" height="180" fill="#203B42"/><text x="630" y="2133" fill="#FFFFFF" font-family="Georgia" font-size="27" font-weight="400">Belle-Rive</text><text x="630" y="2166" fill="#FFFFFF" font-family="Segoe UI" font-size="13" font-weight="400">Démonstration personnelle</text><text x="630" y="2191" fill="#FFFFFF" font-family="Segoe UI" font-size="13" font-weight="400">Commune et données fictives</text><text x="630" y="2216" fill="#FFFFFF" font-family="Segoe UI" font-size="13" font-weight="400">Vue de conception fixe</text><text x="64" y="2330" fill="#203B42" font-family="Segoe UI" font-size="14" font-weight="400">BR-C3 V1 • Compositions proposées — aucun test produit, mobile ou utilisateur exécuté</text></svg>