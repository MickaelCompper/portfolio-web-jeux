<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="870" viewBox="0 0 1440 870" role="img"><title>Belle-Rive — exception horaire et recherche sans résultat</title><desc>Maquette statique de conception. Aucun lien, recherche ou bouton fonctionnel.</desc><rect x="0" y="0" width="1440" height="870" fill="#F7F4EC"/><text x="64" y="65" fill="#203B42" font-family="Segoe UI" font-size="18" font-weight="600">BELLE-RIVE / ÉTATS À NE PAS MASQUER</text><text x="64" y="105" fill="#203B42" font-family="Segoe UI" font-size="18" font-weight="400">Extraits de vues distinctes • propositions fixes • aucune interaction active</text><text x="64" y="172" fill="#203B42" font-family="Georgia" font-size="24" font-weight="400">01 / Exception horaire — IP-01, scénario S2</text><rect x="64" y="202" width="1312" height="163" fill="#F2E9CC"/><rect x="64" y="202" width="5" height="163" fill="#7C601B"/><text x="88" y="237" fill="#665018" font-family="Segoe UI" font-size="13" font-weight="600">FERMETURE EXCEPTIONNELLE</text><text x="88" y="278" fill="#203B42" font-family="Georgia" font-size="25" font-weight="400">Mercredi 18 novembre 2026 : accueil fermé de 14 h à 17 h.</text><text x="88" y="316" fill="#203B42" font-family="Segoe UI" font-size="18" font-weight="400">L’ouverture du matin est maintenue de 9 h à 12 h. Les autres horaires ordinaires restent inchangés.</text><text x="88" y="345" fill="#203B42" font-family="Segoe UI" font-size="13" font-weight="400">Information fictive • à placer avant les horaires ordinaires dans la fiche mairie</text><text x="64" y="438" fill="#203B42" font-family="Georgia" font-size="24" font-weight="400">02 / Recherche sans résultat — scénario S0</text><rect x="64" y="468" width="680" height="54" fill="#FFFFFF" stroke="#C7CDC4"/><text x="84" y="502" fill="#203B42" font-family="Segoe UI" font-size="20" font-weight="400">piscine</text><rect x="744" y="468" width="180" height="54" fill="#174F62"/><text x="770" y="501" fill="#FFFFFF" font-family="Segoe UI" font-size="18" font-weight="400">Rechercher</text><text x="64" y="583" fill="#203B42" font-family="Georgia" font-size="32" font-weight="400">Aucun résultat pour « piscine »</text><text x="64" y="625" fill="#203B42" font-family="Segoe UI" font-size="18" font-weight="400">Essayez d’autres mots ou consultez une rubrique. La recherche porte uniquement sur les contenus fictifs.</text><text x="64" y="681" fill="#174F62" font-family="Segoe UI" font-size="18" font-weight="600">Informations pratiques →</text><text x="518" y="681" fill="#174F62" font-family="Segoe UI" font-size="18" font-weight="600">Agenda →</text><text x="920" y="681" fill="#174F62" font-family="Segoe UI" font-size="18" font-weight="600">Équipements →</text><text x="64" y="751" fill="#203B42" font-family="Segoe UI" font-size="16" font-weight="400">Une indisponibilité technique exige un message différent : « La recherche est momentanément indisponible. »</text><text x="64" y="824" fill="#203B42" font-family="Segoe UI" font-size="13" font-weight="400">BR-C3 V1 • Composition de deux états indépendants, sans modification des scénarios BR-C2</text></svg>