</defs>
<rect width="1600" height="1660" fill="#dfE3dc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#202d32">
 <text x="58" y="48" font-size="16" letter-spacing="2">PORTFOLIO PERSONNEL / RECHERCHE GRAPHIQUE 02</text>
 <text x="1540" y="48" font-size="15" text-anchor="end">PROPOSITION · 21 OCTOBRE 2026</text>
 <rect x="40" y="80" width="1520" height="965" rx="4" fill="url(#paper)"/>
 <rect x="40" y="80" width="1520" height="965" rx="4" fill="url(#dots)" opacity=".32"/>
 <text x="102" y="143" font-size="23" font-weight="600">[Prénom Nom]</text>
 <text x="102" y="171" font-size="14" fill="#526168">Conception et développement web &amp; jeux vidéo</text>
 <g font-size="16"><text x="1050" y="150">Projets</text><text x="1155" y="150">Approche</text><text x="1290" y="150">À propos</text><text x="1450" y="150" text-anchor="end">Contact</text></g>
 <path d="M102 202H1498" stroke="#c5cec5"/>
 <text x="104" y="271" font-size="13" letter-spacing="2.2" fill="#17645f">CONCEPTION NUMÉRIQUE · INFORMATION &amp; MÉDIATION</text>
 <g font-family="Georgia, serif" font-size="67" letter-spacing="-2">
  <text x="100" y="359">Des sites utiles et des</text>
  <text x="100" y="439">expériences ludiques</text>
  <text x="100" y="519">pour informer, orienter</text>
  <text x="100" y="599" fill="#17645f" font-style="italic">et faire découvrir.</text>
 </g>
 <path d="M103 627C238 615 384 618 519 625" fill="none" stroke="#b15d42" stroke-width="2.5"/>
 <text x="104" y="685" font-size="21" fill="#526168">Des parcours clairs. Des graphismes simples et soignés.</text>
 <text x="104" y="719" font-size="21" fill="#526168">Un travail dont les choix et les limites restent lisibles.</text>
 <rect x="104" y="760" width="269" height="57" rx="4" fill="#17645f"/>
 <text x="126" y="796" font-size="17" fill="#fff">Découvrir les projets</text>
 <path d="M333 781L342 789L333 797M323 789H341" fill="none" stroke="#fff" stroke-width="1.6"/>
 <text x="405" y="795" font-size="17">Comprendre mon approche</text>
 <path d="M405 805H614" stroke="#202d32" stroke-width=".8"/>
 <g transform="translate(850 292) scale(.97)"><use href="#scene"/></g>
 <text x="888" y="793" font-size="13" letter-spacing="1.7" fill="#17645f">01 / COMPOSITION, MATIÈRES, PROFONDEUR</text>
 <text x="888" y="820" font-size="15" fill="#526168">Étude d’illustration originale, sans projet associé.</text>
 <path d="M104 872H1498" stroke="#c5cec5"/>
 <g font-size="14" letter-spacing="1.4" fill="#526168"><text x="104" y="916">LA CLARTÉ DU PARCOURS</text><text x="578" y="916">LE SOIN DE L’INTERACTION</text><text x="1050" y="916">LA QUALITÉ EXAMINABLE</text></g>
 <g font-family="Georgia, serif" font-size="25"><text x="104" y="959">Comprendre avant d’agir.</text><text x="578" y="959">Donner du sens aux détails.</text><text x="1050" y="959">Montrer, expliquer, documenter.</text></g>
 <text x="104" y="1010" font-size="13" fill="#526168">Composition d’intention pour l’accueil · textes complémentaires proposés · éléments de navigation non actifs</text>
 <!-- Detail boards -->
 <rect x="40" y="1073" width="484" height="435" fill="#f7f5ef"/>
 <rect x="538" y="1073" width="484" height="435" fill="url(#green)"/>
 <rect x="1036" y="1073" width="524" height="435" fill="#f7f5ef"/>
 <text x="72" y="1114" font-size="13" letter-spacing="1.5" fill="#526168">02 / TYPOGRAPHIE &amp; RYTHME</text>
 <text x="70" y="1201" font-family="Georgia, serif" font-size="77" letter-spacing="-3">Aa &amp; 012</text>
 <text x="72" y="1243" font-size="15" fill="#526168">Georgia · titres et moments éditoriaux</text>
 <path d="M72 1270H492" stroke="#c5cec5"/>
 <text x="72" y="1314" font-size="23" font-weight="600">La précision sans la froideur.</text>
 <text x="72" y="1347" font-size="17">Segoe UI · lecture, actions et légendes.</text>
 <g><rect x="72" y="1382" width="77" height="44" fill="#202d32"/><rect x="157" y="1382" width="77" height="44" fill="#17645f"/><rect x="242" y="1382" width="77" height="44" fill="#a4412b"/><rect x="327" y="1382" width="77" height="44" fill="#e3eeea"/><rect x="412" y="1382" width="77" height="44" fill="#dfc89d"/></g>
 <text x="72" y="1469" font-size="15" fill="#526168">Ivoire · encre · vert profond · accents terre</text>
 <g fill="#f7f5ef">
  <text x="574" y="1114" font-size="13" letter-spacing="1.5">03 / L’ÉTUDE DE CAS</text>
  <text x="574" y="1180" font-size="19">01</text><text x="625" y="1180" font-family="Georgia, serif" font-size="34">Voir</text>
  <text x="625" y="1211" font-size="16" fill="#d6e3d8">Le besoin, le parcours, les choix.</text>
  <path d="M574 1235H984" stroke="#73938a"/>
  <text x="574" y="1281" font-size="19">02</text><text x="625" y="1281" font-family="Georgia, serif" font-size="34">Essayer</text>
  <text x="625" y="1312" font-size="16" fill="#d6e3d8">L’expérience et ses conditions.</text>
  <path d="M574 1336H984" stroke="#73938a"/>
  <text x="574" y="1382" font-size="19">03</text><text x="625" y="1382" font-family="Georgia, serif" font-size="34">Examiner</text>
  <text x="625" y="1413" font-size="16" fill="#d6e3d8">Les preuves et leurs limites.</text>
  <text x="574" y="1471" font-size="14" fill="#d6e3d8">Trois lectures du même travail.</text>
 </g>
 <text x="1072" y="1114" font-size="13" letter-spacing="1.5" fill="#526168">04 / UN DÉTAIL QUI EXPLIQUE</text>
 <g transform="translate(1102 1125) scale(.56)"><use href="#scene"/></g>
 <path d="M1072 1406H1524" stroke="#c5cec5"/>
 <text x="1072" y="1442" font-size="16">Des couches, des repères et un point d’attention.</text>
 <text x="1072" y="1470" font-size="14" fill="#526168">Un vocabulaire illustratif, pas un univers de jeu retenu.</text>
 <text x="58" y="1552" font-size="18" font-weight="600">Une simplicité construite : proportions, hiérarchie, matière et détails.</text>
 <text x="58" y="1585" font-size="15" fill="#526168">Planche V2 à arbitrer · aucune interface fonctionnelle · aucune capture de produit · aucun test d’usage exécuté</text>
 <text x="58" y="1616" font-size="15" fill="#526168">Belle-Rive, les six concepts et leur ordre restent ouverts. La V1 est conservée.</text>
</g></svg>
