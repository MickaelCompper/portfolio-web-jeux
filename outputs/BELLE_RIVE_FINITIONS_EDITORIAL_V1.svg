<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1880" viewBox="0 0 1700 1880" role="img"><title>Belle-Rive — six vues éditoriales fixes</title><desc>Six compositions statiques, sans saisie ni lien actif. Données fictives.</desc><rect x="0" y="0" width="1700" height="1880" fill="#E2E6DF"/><text x="70" y="61" font-family="Segoe UI" font-size="23" fill="#203B42">BELLE-RIVE / SÉQUENCE ÉDITORIALE PROPOSÉE</text><text x="70" y="101" font-family="Segoe UI" font-size="18" fill="#203B42">D-03 • États successifs ou variantes nommées • Aucun formulaire actif, aucun secret généré</text><rect x="70" y="155" width="760" height="495" fill="#F7F4EC"/><rect x="70" y="155" width="760" height="42" fill="#203B42"/><text x="92" y="182" font-family="Segoe UI" font-size="13" fill="#FFFFFF">BELLE-RIVE / ÉDITION LOCALE — VUE FIXE</text><text x="94" y="240" font-family="Georgia" font-size="28" fill="#203B42">01  Ouvrir l’édition</text><text x="94" y="271" font-family="Segoe UI" font-size="14" fill="#203B42">Connexion locale • point de départ de la séquence</text><text x="94" y="313" font-family="Segoe UI" font-size="17" fill="#203B42">Saisissez le secret affiché dans votre terminal local.</text><text x="94" y="340" font-family="Segoe UI" font-size="17" fill="#203B42">Il ne s’agit pas d’un compte usager.</text><text x="94" y="394" font-family="Segoe UI" font-size="16" fill="#203B42">Secret de lancement</text><rect x="94" y="406" width="620" height="43" fill="#FFFFFF" stroke="#C7CDC4"/><text x="108" y="434" font-family="Segoe UI" font-size="17" fill="#203B42">Champ vide — aucun secret dans la maquette</text><text x="94" y="477" font-family="Segoe UI" font-size="15" fill="#203B42">Le collage et les outils d’assistance restent autorisés.</text><rect x="94" y="508" width="230" height="45" fill="#174F62"/><text x="108" y="537" font-family="Segoe UI" font-size="16" fill="#FFFFFF">Ouvrir l’édition</text><text x="94" y="592" font-family="Segoe UI" font-size="14" fill="#203B42">Focus initial : titre ; puis libellé, champ, action.</text><text x="94" y="615" font-family="Segoe UI" font-size="14" fill="#203B42">Échec : message lié au champ, pas de secret réaffiché.</text><rect x="870" y="155" width="760" height="495" fill="#F7F4EC"/><rect x="870" y="155" width="760" height="42" fill="#203B42"/><text x="892" y="182" font-family="Segoe UI" font-size="13" fill="#FFFFFF">BELLE-RIVE / ÉDITION LOCALE — VUE FIXE</text><text x="894" y="240" font-family="Georgia" font-size="28" fill="#203B42">02  Préparer le brouillon</text><text x="894" y="271" font-family="Segoe UI" font-size="14" fill="#203B42">IP-01 • base publique r1 • variante S1</text><rect x="894" y="294" width="712" height="37" fill="#DCE5D6"/><text x="906" y="319" font-family="Segoe UI" font-size="15" fill="#203B42">BROUILLON — NON PUBLIÉ • version publique r1 inchangée</text><text x="894" y="362" font-family="Segoe UI" font-size="16" fill="#203B42">Date de l’exception</text><rect x="894" y="374" width="300" height="43" fill="#FFFFFF" stroke="#C7CDC4"/><text x="908" y="402" font-family="Segoe UI" font-size="17" fill="#203B42">18 novembre 2026</text><text x="1216" y="362" font-family="Segoe UI" font-size="16" fill="#203B42">Période affectée</text><rect x="1216" y="374" width="365" height="43" fill="#FFFFFF" stroke="#C7CDC4"/><text x="1230" y="402" font-family="Segoe UI" font-size="17" fill="#203B42">14 h–17 h</text><text x="894" y="455" font-family="Segoe UI" font-size="18" fill="#203B42">Accueil fermé de 14 h à 17 h.</text><text x="894" y="482" font-family="Segoe UI" font-size="18" fill="#203B42">Ouverture du matin maintenue de 9 h à 12 h.</text><rect x="894" y="505" width="230" height="45" fill="#174F62"/><text x="908" y="534" font-family="Segoe UI" font-size="16" fill="#FFFFFF">Enregistrer le brouillon</text><text x="1156" y="535" font-family="Segoe UI" font-size="16" fill="#174F62">Préparer la publication →</text><text x="894" y="592" font-family="Segoe UI" font-size="14" fill="#203B42">État représenté après saisie : modifications non enregistrées.</text><text x="894" y="615" font-family="Segoe UI" font-size="14" fill="#203B42">Après succès seulement : « Brouillon enregistré », date réelle.</text><rect x="70" y="700" width="760" height="495" fill="#F7F4EC"/><rect x="70" y="700" width="760" height="42" fill="#203B42"/><text x="92" y="727" font-family="Segoe UI" font-size="13" fill="#FFFFFF">BELLE-RIVE / ÉDITION LOCALE — VUE FIXE</text><text x="94" y="785" font-family="Georgia" font-size="28" fill="#203B42">03  Corriger avant publication</text><text x="94" y="816" font-family="Segoe UI" font-size="14" fill="#203B42">Variante S9 • période manquante • aucune publication effectuée</text><rect x="94" y="839" width="712" height="99" fill="#F1E3DC"/><text x="110" y="871" font-family="Segoe UI" font-size="18" fill="#783B28">La publication est bloquée : 1 champ à corriger.</text><text x="110" y="900" font-family="Segoe UI" font-size="18" fill="#783B28">Renseignez la période affectée.</text><text x="94" y="978" font-family="Segoe UI" font-size="16" fill="#203B42">Période affectée — obligatoire</text><rect x="94" y="990" width="620" height="43" fill="#FFFFFF" stroke="#C7CDC4"/><text x="108" y="1018" font-family="Segoe UI" font-size="17" fill="#203B42">Champ vide</text><text x="94" y="1052" font-family="Segoe UI" font-size="16" fill="#783B28">Indiquez les heures de début et de fin de la fermeture.</text><rect x="94" y="1077" width="230" height="45" fill="#174F62"/><text x="108" y="1106" font-family="Segoe UI" font-size="16" fill="#FFFFFF">Vérifier les informations</text><text x="94" y="1153" font-family="Segoe UI" font-size="14" fill="#203B42">Focus : synthèse d’erreurs → champ concerné ; saisie conservée.</text><rect x="870" y="700" width="760" height="495" fill="#F7F4EC"/><rect x="870" y="700" width="760" height="42" fill="#203B42"/><text x="892" y="727" font-family="Segoe UI" font-size="13" fill="#FFFFFF">BELLE-RIVE / ÉDITION LOCALE — VUE FIXE</text><text x="894" y="785" font-family="Georgia" font-size="28" fill="#203B42">04  Confirmer la publication</text><text x="894" y="816" font-family="Segoe UI" font-size="14" fill="#203B42">Après correction et enregistrement • résumé relu avant action</text><text x="894" y="862" font-family="Segoe UI" font-size="18" fill="#203B42">Vous allez remplacer la version publique r1 de la fiche mairie.</text><text x="894" y="895" font-family="Segoe UI" font-size="18" fill="#203B42">Nouvelle exception : 18 novembre 2026, 14 h–17 h fermé.</text><text x="894" y="928" font-family="Segoe UI" font-size="18" fill="#203B42">Matin maintenu : 9 h–12 h.</text><text x="894" y="961" font-family="Segoe UI" font-size="18" fill="#203B42">La version précédente restera conservée.</text><rect x="894" y="1032" width="245" height="45" fill="#174F62"/><text x="908" y="1061" font-family="Segoe UI" font-size="16" fill="#FFFFFF">Publier cette révision</text><text x="1170" y="1062" font-family="Segoe UI" font-size="16" fill="#174F62">Revenir au brouillon</text><text x="894" y="1128" font-family="Segoe UI" font-size="14" fill="#203B42">Focus : titre, résumé puis action explicite ; pas de publication au focus.</text><text x="894" y="1151" font-family="Segoe UI" font-size="14" fill="#203B42">L’action transmet une opération identifiée ; double clic sans doublon.</text><rect x="70" y="1245" width="760" height="495" fill="#F7F4EC"/><rect x="70" y="1245" width="760" height="42" fill="#203B42"/><text x="92" y="1272" font-family="Segoe UI" font-size="13" fill="#FFFFFF">BELLE-RIVE / ÉDITION LOCALE — VUE FIXE</text><text x="94" y="1330" font-family="Georgia" font-size="28" fill="#203B42">05  Publication à vérifier</text><text x="94" y="1361" font-family="Segoe UI" font-size="14" fill="#203B42">Branche d’incertitude • réponse perdue • résultat encore inconnu</text><rect x="94" y="1384" width="712" height="95" fill="#F2E9CC"/><text x="110" y="1416" font-family="Segoe UI" font-size="18" fill="#203B42">La confirmation n’a pas été reçue.</text><text x="110" y="1445" font-family="Segoe UI" font-size="18" fill="#203B42">La publication a peut-être été enregistrée.</text><text x="94" y="1523" font-family="Segoe UI" font-size="17" fill="#203B42">Vérifiez le résultat avant de recommencer.</text><text x="94" y="1550" font-family="Segoe UI" font-size="17" fill="#203B42">Référence d’exemple : OP-DEMO-02, sans valeur de secret.</text><rect x="94" y="1594" width="230" height="45" fill="#174F62"/><text x="108" y="1623" font-family="Segoe UI" font-size="16" fill="#FFFFFF">Vérifier le résultat</text><text x="94" y="1676" font-family="Segoe UI" font-size="14" fill="#203B42">Focus : titre ; aucune annonce « échec » ou « succès » inventée.</text><text x="94" y="1699" font-family="Segoe UI" font-size="14" fill="#203B42">Après redémarrage : reconnexion, puis recherche de cette opération.</text><rect x="870" y="1245" width="760" height="495" fill="#F7F4EC"/><rect x="870" y="1245" width="760" height="42" fill="#203B42"/><text x="892" y="1272" font-family="Segoe UI" font-size="13" fill="#FFFFFF">BELLE-RIVE / ÉDITION LOCALE — VUE FIXE</text><text x="894" y="1330" font-family="Georgia" font-size="28" fill="#203B42">06  Révision publiée</text><text x="894" y="1361" font-family="Segoe UI" font-size="14" fill="#203B42">Résultat confirmé • scénario S2 • pas une publication réelle</text><rect x="894" y="1384" width="712" height="77" fill="#DCE5D6"/><text x="910" y="1429" font-family="Georgia" font-size="23" fill="#203B42">La révision r2 est publiée dans le scénario.</text><text x="894" y="1508" font-family="Segoe UI" font-size="18" fill="#203B42">Exception : 18 novembre 2026, après-midi fermé.</text><text x="894" y="1538" font-family="Segoe UI" font-size="18" fill="#203B42">Matin maintenu de 9 h à 12 h.</text><text x="894" y="1568" font-family="Segoe UI" font-size="18" fill="#203B42">La révision r1 reste dans l’historique.</text><rect x="894" y="1610" width="265" height="45" fill="#174F62"/><text x="908" y="1639" font-family="Segoe UI" font-size="16" fill="#FFFFFF">Consulter la fiche publique</text><text x="894" y="1694" font-family="Segoe UI" font-size="14" fill="#203B42">Horodatage réel à afficher seulement après exécution réussie.</text><text x="70" y="1792" font-family="Segoe UI" font-size="17" fill="#203B42">Lecture : 01 → 02 → 04 → 06. La vue 03 est une erreur à corriger ; la vue 05 est une branche d’incertitude.</text><text x="70" y="1821" font-family="Segoe UI" font-size="17" fill="#203B42">La sortie et la déconnexion restent disponibles dans le futur outil ; aucune donnée réelle, aucun test produit ici.</text></svg>